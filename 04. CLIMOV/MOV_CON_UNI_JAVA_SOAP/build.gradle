plugins {
    id 'com.android.application' version '9.4.0'
}

android {
    namespace = 'ec.edu.monster'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ec.espe.convertidor'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Las pruebas viven en ec/edu/monster/pruebas (junto a controlador, modelo y vista):
    // se excluyen del APK y se compilan/ejecutan como pruebas unitarias.
    sourceSets {
        main {
            java.filter.exclude('ec/edu/monster/pruebas/**')
        }
        test {
            java.srcDir('src/main/java/ec/edu/monster/pruebas')
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
